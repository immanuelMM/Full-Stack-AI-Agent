<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Studio</title>
<style>
  :root {
    --bg: #0a0e1d; --floor: #0f1530; --panel: #151c3a; --panel-2: #1b2448; --line: #2a3566;
    --text: #e8ebf7; --muted: #8b93b8; --ok: #3ddc97; --warn: #ffb648;
    --tile: rgba(255,255,255,.035);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1f8; --floor: #f7f8fd; --panel: #ffffff; --panel-2: #f1f3fa; --line: #d3d9ec;
      --text: #1a2040; --muted: #5d6689; --tile: rgba(20,30,80,.05);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", Inter, system-ui, -apple-system, sans-serif; min-height: 100vh; }

  /* ---------- header ---------- */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 20px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .2px; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, #a78bfa, #22d3ee); font-size: 15px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live .dot { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 1.6s infinite; }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--panel-2); }
  button.primary { background: linear-gradient(135deg, #7c5cf5, #1fb5d6); border-color: transparent; color: #fff; }

  /* ---------- pipeline ---------- */
  .pipeline { display: flex; align-items: center; gap: 6px; padding: 0 20px 12px; overflow-x: auto; }
  .stage { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px; transition: all .4s; }
  .stage .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px;
    background: var(--panel-2); }
  .stage.done { color: var(--text); }
  .stage.done .n { background: var(--ok); color: #062; }
  .stage.active { color: var(--text); border-color: #7c5cf5; box-shadow: 0 0 0 3px rgba(124,92,245,.25); }
  .stage.active .n { background: #7c5cf5; color: #fff; animation: pulse 1.4s infinite; }
  .arrow { color: var(--line); flex: none; }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 0 20px 20px; }
  @media (max-width: 960px) { main { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) { header, .pipeline { padding-left: 16px; padding-right: 16px; } main { padding: 0 16px 16px; } }

  /* ---------- office floor ---------- */
  .floor { position: relative; height: max(560px, calc(100vh - 150px)); border-radius: 20px; overflow: hidden;
    border: 1px solid var(--line);
    background:
      radial-gradient(ellipse at center, rgba(124,92,245,.16), transparent 60%),
      linear-gradient(var(--tile) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, var(--tile) 1px, transparent 1px) 0 0 / 44px 44px,
      var(--floor); }
  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wire { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 6; transition: stroke .4s; }
  .wire.active { stroke: var(--c); stroke-width: 2.5; animation: flow .8s linear infinite; }
  .empty { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); color: var(--muted);
    font-size: 13px; text-align: center; width: 90%; }

  .desk { position: absolute; width: 150px; transform: translate(-50%, -50%); text-align: center;
    transition: left .6s ease, top .6s ease; z-index: 2; }
  .avatar { position: relative; width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
    font-size: 30px; background: var(--panel); border: 2px solid color-mix(in srgb, var(--c) 35%, transparent);
    transition: border-color .3s, box-shadow .3s, opacity .3s; }
  .avatar .face { display: inline-block; }
  .desk.idle .avatar { opacity: .65; }
  .desk.working .avatar { border-color: var(--c); animation: glow 1.6s infinite; }
  .desk.working .face { animation: bob 1s ease-in-out infinite; }
  .desk.done .avatar::after { content: "✓"; position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--ok); color: #053; font-size: 13px; font-weight: 800; display: grid; place-items: center;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .laptop { width: 54px; height: 6px; margin: 6px auto 0; border-radius: 3px; background: var(--panel-2);
    display: flex; justify-content: center; align-items: center; gap: 3px; }
  .laptop i { width: 4px; height: 4px; border-radius: 50%; background: var(--c); opacity: 0; }
  .desk.working .laptop i { animation: type 1s infinite; }
  .desk.working .laptop i:nth-child(2) { animation-delay: .15s; }
  .desk.working .laptop i:nth-child(3) { animation-delay: .3s; }
  .name { margin-top: 6px; font-weight: 650; }
  .role { color: var(--muted); font-size: 12px; }
  .status { display: inline-block; margin-top: 4px; font-size: 11px; padding: 1px 8px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .desk.working .status { color: var(--text); border-color: var(--c); }
  .desk.done .status { color: var(--ok); border-color: var(--ok); }
  .badge { position: absolute; top: -4px; left: calc(50% + 20px); min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: var(--c); color: #fff; font-size: 11px; font-weight: 700; display: none;
    place-items: center; }
  .badge.show { display: grid; }
  .bubble { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translate(-50%, 6px); max-width: 230px;
    padding: 6px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--c); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s, transform .3s;
    box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .bubble.show { opacity: 1; transform: translate(-50%, 0); }

  .desk.lead { width: 180px; z-index: 3; }
  .desk.lead .avatar { width: 84px; height: 84px; font-size: 40px; }
  .orbit { position: absolute; inset: -10px; border-radius: 50%; border: 2px dashed var(--c); opacity: 0; }
  .desk.lead.working .orbit { opacity: .7; animation: spin 6s linear infinite; }

  .packet { position: absolute; z-index: 5; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    display: grid; place-items: center; font-size: 15px; background: var(--panel); border: 2px solid var(--c);
    box-shadow: 0 0 18px var(--c); pointer-events: none; }
  .float { position: absolute; z-index: 4; transform: translate(-50%, -50%); font-size: 11px; padding: 2px 8px;
    border-radius: 999px; background: var(--c); color: #fff; white-space: nowrap; pointer-events: none;
    animation: rise 1.8s ease-out forwards; }

  /* ---------- side panel ---------- */
  aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; }
  .feed { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: flex;
    flex-direction: column; min-height: 320px; max-height: calc(100vh - 250px); }
  @media (max-width: 960px) { .feed { max-height: 420px; } }
  .feed h2 { margin: 0; padding: 12px 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); border-bottom: 1px solid var(--line); }
  .feed ol { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; flex: 1; }
  .feed li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline; padding: 6px 14px;
    animation: slide .35s ease-out; }
  .feed li .d { width: 8px; height: 8px; border-radius: 50%; background: var(--c); transform: translateY(-1px); }
  .feed li .who { font-weight: 650; }
  .feed li .what { color: var(--muted); word-break: break-word; }
  .feed li time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* ---------- narrator (phase guide for the /feature-dev demo) ---------- */
  .narrator { margin: 0 20px 12px; padding: 10px 14px; border-radius: 14px; background: var(--panel);
    border: 1px solid #7c5cf5; box-shadow: 0 0 0 3px rgba(124,92,245,.15); display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 600px) { .narrator { margin: 0 16px 12px; } }
  .narrator .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .phases { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .ph { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap; transition: all .3s; }
  .ph.done { color: var(--text); border-color: var(--ok); }
  .ph.done::before { content: "✓ "; color: var(--ok); }
  .ph.active { background: #7c5cf5; border-color: #7c5cf5; color: #fff; }
  #phaseText { margin: 0; }
  #phaseText b { margin-right: 4px; }

  /* ---------- tabs ---------- */
  [hidden] { display: none !important; }
  .tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .tab { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 7px; }
  .tab:hover { color: var(--text); background: transparent; }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .tab:focus-visible, .desk:focus-visible { outline: 2px solid #7c5cf5; outline-offset: 2px; }

  /* ---------- avatars (shared by floor and roster) ---------- */
  .face { display: block; width: 100%; height: 100%; }
  .face svg, .portrait svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .desk { cursor: pointer; }

  /* ---------- team roster ---------- */
  .team { padding: 4px 20px 28px; max-width: 1320px; margin: 0 auto; }
  @media (max-width: 600px) { .team { padding: 4px 16px 20px; } }
  .team-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 18px; border-radius: 20px;
    border: 1px solid var(--line);
    background: radial-gradient(ellipse at 0% 0%, rgba(124,92,245,.2), transparent 55%),
                radial-gradient(ellipse at 100% 100%, rgba(34,211,238,.14), transparent 55%), var(--panel); }
  .team-emblem { width: 56px; height: 56px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 28px;
    background: linear-gradient(135deg, #7c5cf5, #1fb5d6); }
  .team-head .t { flex: 1 1 320px; min-width: 0; }
  .team-head .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .team-head h1 { margin: 2px 0 4px; font-size: 22px; }
  .team-head p { margin: 0; color: var(--muted); max-width: 75ch; }
  .team-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .team-stats .stat { min-width: 76px; }
  .group-title { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
  .group-title h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .group-title span { color: var(--muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 16px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--line); overflow: hidden; scroll-margin-top: 16px; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c); }
  .card.flash { animation: flash 1.8s ease-out; }
  .card-top { display: flex; gap: 14px; align-items: center; }
  .portrait { width: 76px; height: 76px; flex: none; border-radius: 50%; padding: 2px;
    background: color-mix(in srgb, var(--c) 30%, var(--panel)); border: 2px solid var(--c); }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.2; }
  .card .id { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.strong { border-color: var(--c); color: var(--text); }
  .card .about { margin: 0; }
  .card h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .duties { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .duties li { margin: 2px 0; }
  .duties li::marker { color: var(--c); }
  .skills { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .skill { padding: 8px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
    border-left: 3px solid var(--c); }
  .skill .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; align-items: baseline; }
  .skill b { font: 600 12.5px ui-monospace, Consolas, monospace; }
  .skill small { font-size: 10.5px; color: var(--muted); }
  .skill p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
  .noskill { margin: 0; padding: 8px 10px; border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); font-size: 12.5px; }
  .card .tools { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .card .tools code { font: 11.5px ui-monospace, Consolas, monospace; color: var(--text); }
  .card .floor-link { font-size: 12px; padding: 4px 10px; }

  /* ---------- team flow (agents joined by arrows) ---------- */
  .flows { display: flex; flex-direction: column; gap: 14px; }
  .lane { padding: 14px 16px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  .lane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 12px; }
  .lane-head h3 { margin: 0; font-size: 14px; }
  .lane-head span { color: var(--muted); font-size: 12px; }
  .flow { list-style: none; margin: 0; padding: 0; display: grid; align-items: center;
    grid-template-columns: minmax(0, 1fr) repeat(calc(var(--n) - 1), 30px minmax(0, 1fr)); }
  .flow > li { display: contents; }
  .flow-arrow { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); }
  .flow-arrow svg { width: 30px; height: 12px; overflow: visible; }
  .flow-arrow line { stroke: currentColor; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1s linear infinite; }
  .flow-arrow path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .node { flex: 1 1 0; min-width: 0; align-self: stretch; display: flex; flex-direction: column; gap: 8px; padding: 10px;
    border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); border-top: 3px solid var(--c); }
  .node .step { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .node .step b { color: var(--text); }
  .node .who { display: flex; flex-direction: column; gap: 4px; }
  .agent-link { display: flex; align-items: center; gap: 8px; width: 100%; padding: 3px; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .agent-link:hover { background: var(--panel); border-color: var(--line); }
  .agent-link:focus-visible { outline: 2px solid #7c5cf5; outline-offset: 1px; }
  .agent-link .mini { position: relative; width: 38px; height: 38px; flex: none; border-radius: 50%;
    border: 2px solid var(--ac); background: color-mix(in srgb, var(--ac) 25%, var(--panel)); }
  .agent-link .mini svg { display: block; width: 100%; height: 100%; }
  .agent-link .mini .x { position: absolute; top: -6px; right: -8px; padding: 0 5px; border-radius: 999px; font-size: 10px;
    background: var(--ac); color: #0a0e1d; font-weight: 700; }
  .agent-link .nm { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  .agent-link.you { cursor: default; }
  .agent-link.you:hover { background: transparent; border-color: transparent; }
  .agent-link.you .mini { display: grid; place-items: center; font-size: 20px; }
  .node .what { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .node .loop { align-self: flex-start; justify-self: start; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; color: var(--warn);
    border: 1px dashed color-mix(in srgb, var(--warn) 60%, transparent); }
  @media (max-width: 1080px) {
    .flow { grid-template-columns: minmax(0, 1fr); }
    .flow-arrow { justify-self: center; }
    .flow-arrow svg { transform: rotate(90deg); }
    .node { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr); align-items: center; gap: 4px 12px; }
    .node .step { grid-column: 1 / -1; }
    .node .what, .node .loop { grid-column: 2; }
  }
  @media (max-width: 480px) { .node { grid-template-columns: minmax(0, 1fr); } .node .what, .node .loop { grid-column: 1; } }

  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--c); } 100% { box-shadow: 0 0 0 3px transparent; } }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(61,220,151,.6); } 100% { box-shadow: 0 0 0 8px rgba(61,220,151,0); } }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); }
                    100% { box-shadow: 0 0 0 16px transparent; } }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
  @keyframes type { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @keyframes rise { 0% { opacity: 0; margin-top: 0; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -60px; } }
  @keyframes slide { from { opacity: 0; transform: translateX(10px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">✦</span>Agent Studio</div>
  <div class="tabs" role="tablist" aria-label="View">
    <button class="tab" role="tab" id="tabFloor" aria-controls="viewFloor" aria-selected="true">🏢 Office floor</button>
    <button class="tab" role="tab" id="tabTeam" aria-controls="viewTeam" aria-selected="false" tabindex="-1">👥 Team roster</button>
  </div>
  <span class="chip">App <b id="app">—</b></span>
  <span class="chip" id="conn"><span class="dot"></span><span id="connText">Connecting…</span></span>
  <span class="spacer"></span>
  <button id="voiceBtn" aria-pressed="false" title="Read out what the agents are doing">🔇 Voice off</button>
  <button class="primary" id="demoBtn" title="Plan → Build → Test → Review → Docs → Deploy for a feature">▶ Play demo</button>
  <button class="primary" id="featureBtn" title="How Scout, Architect and Second Opinion work in /feature-dev">▶ Big feature demo</button>
  <button id="resetBtn">Reset</button>
</header>

<div id="viewFloor" role="tabpanel" aria-labelledby="tabFloor">
<nav class="pipeline" id="pipeline"></nav>
<div class="narrator" id="narrator" aria-live="polite" hidden>
  <span class="kicker">/feature-dev · big feature in an existing app</span>
  <div class="phases" id="phases"></div>
  <p id="phaseText"></p>
</div>

<main>
  <section class="floor" id="floor">
    <svg class="wires" id="wires"></svg>
    <div class="empty" id="empty">Waiting for the team… Dispatch an agent in Claude Code, or press <b>Play demo</b>.</div>
  </section>
  <aside>
    <div class="stats">
      <div class="stat"><b id="sActive">0</b><span>working</span></div>
      <div class="stat"><b id="sTools">0</b><span>actions</span></div>
      <div class="stat"><b id="sFiles">0</b><span>files</span></div>
      <div class="stat"><b id="sTime">0:00</b><span>elapsed</span></div>
    </div>
    <div class="feed"><h2>Team activity</h2><ol id="feed"></ol></div>
  </aside>
</main>
</div>

<section class="team" id="viewTeam" role="tabpanel" aria-labelledby="tabTeam" hidden></section>

<script>
const STAGES = ['Plan', 'Build', 'Test', 'Review', 'Docs', 'Deploy'];
const ROSTER = {
  'lead':               { name: 'Lead',     role: 'Claude · orchestrator', icon: '🧠', color: '#a78bfa' },
  'research-planner':   { name: 'Planner',  role: 'Research & plan',       icon: '🧭', color: '#22d3ee', stage: 'Plan' },
  'backend-dotnet-dev': { name: 'Backend',  role: '.NET API',              icon: '🛠️', color: '#60a5fa', stage: 'Build' },

const TOOL_ICON = { Read: '📖', Edit: '✏️', MultiEdit: '✏️', Write: '📝', Bash: '⌨️', PowerShell: '⌨️', Grep: '🔍',
  Glob: '🔍', WebSearch: '🌐', WebFetch: '🌐', Agent: '📨', Task: '📨', Skill: '🧩', SendMessage: '💬' };
const REVIEW_SKILLS = /review|security/i;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);

const $ = (id) => document.getElementById(id);
const floor = $('floor'), wires = $('wires');
let desks = {}, idMap = {}, files = new Set(), tools = 0, startT = 0, lastDispatched = null, stageSeen = new Set();

/* ---------- pipeline ---------- */
$('pipeline').innerHTML = STAGES.map((s, i) =>
  (i ? '<span class="arrow">›</span>' : '') + `<div class="stage" data-s="${s}"><span class="n">${i + 1}</span>${s}</div>`).join('');
function updateStages(extraActive) {
  const active = new Set(extraActive ? [extraActive] : []);
  for (const d of Object.values(desks)) if (d.state === 'working' && d.info.stage) active.add(d.info.stage);
  active.forEach((s) => stageSeen.add(s));
  document.querySelectorAll('.stage').forEach((el) => {
    el.classList.toggle('active', active.has(el.dataset.s));
    el.classList.toggle('done', stageSeen.has(el.dataset.s) && !active.has(el.dataset.s));
  });
}

/* ---------- desks ---------- */
function infoFor(type) {
  return ROSTER[type] || EXTRA[type] || { name: type.replace(/-/g, ' '), role: 'Agent', icon: '🤖', color: '#94a3b8' };
}
function ensureDesk(type) {
  if (desks[type]) return desks[type];
  const info = infoFor(type);
  const el = document.createElement('div');
  el.className = 'desk idle' + (type === 'lead' ? ' lead' : '');
  el.style.setProperty('--c', info.color);
  el.innerHTML = `<div class="bubble"></div>
    <div class="avatar">${type === 'lead' ? '<span class="orbit"></span>' : ''}<span class="face">${avatarSVG(type)}</span></div>
    <span class="badge"></span>
    <div class="laptop"><i></i><i></i><i></i></div>
    <div class="name"></div><div class="role"></div><div class="status">idle</div>`;
  el.querySelector('.name').textContent = info.name;
  el.querySelector('.role').textContent = info.role;
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${info.name} — open profile`);
  el.onclick = () => openProfile(type);
  el.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openProfile(type); } };
  floor.appendChild(el);
  const wire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  wire.setAttribute('class', 'wire');
  wire.style.setProperty('--c', info.color);
  if (type !== 'lead') wires.appendChild(wire);
  desks[type] = { type, info, el, wire, state: 'idle', ids: new Set(), actions: 0, timer: null, gen: 0, pos: { x: 0, y: 0 } };
  layout();
  return desks[type];
}
function layout() {
  // centre sits a little low so the top desk's speech bubble fits inside the floor
  const w = floor.clientWidth, h = floor.clientHeight, cx = w / 2, cy = h / 2 + 14;
  const members = Object.values(desks).filter((d) => d.type !== 'lead');
  const rx = Math.max(w / 2 - 95, 110), ry = Math.max(h / 2 - 105, 120);
  members.forEach((d, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / members.length;
    d.pos = { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) };
  });
  if (desks.lead) desks.lead.pos = { x: cx, y: cy };
  wires.setAttribute('viewBox', `0 0 ${w} ${h}`);
  for (const d of Object.values(desks)) {
    d.el.style.left = d.pos.x + 'px';
    d.el.style.top = d.pos.y + 'px';
    if (d.type !== 'lead') d.wire.setAttribute('d', curvePath(desks.lead.pos, d.pos));
  }
}
function ctrlPoint(a, b) { // gentle curve between two points
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
  return { x: mx - dy * 0.15, y: my + dx * 0.15 };
}

addEventListener('resize', layout);

function setBubble(d, text, icon) {
  const b = d.el.querySelector('.bubble');
  b.textContent = (icon ? icon + ' ' : '') + text;
  b.title = text;
  b.classList.toggle('show', !!text);
}
function setState(d, state, statusText) {
  clearTimeout(d.timer);
  d.state = state;
  d.el.classList.remove('idle', 'working', 'done');
  d.el.classList.add(state);
  d.el.querySelector('.status').textContent = statusText || state;
  if (d.wire) d.wire.classList.toggle('active', state === 'working');
  const badge = d.el.querySelector('.badge');
  badge.textContent = d.ids.size > 1 ? '×' + d.ids.size : '';
  badge.classList.toggle('show', d.ids.size > 1);

  updateStages();

}
function refreshLead() {
  const lead = desks.lead;
  const busy = Object.values(desks).some((d) => d.type !== 'lead' && d.state === 'working');
  lead.el.classList.toggle('working', busy || lead.state === 'working');
  lead.el.classList.toggle('idle', !busy && lead.state !== 'working');
  lead.el.querySelector('.status').textContent = busy ? 'orchestrating' : lead.state === 'working' ? 'thinking' : 'idle';

/* ---------- animation helpers ---------- */
function packet(from, to, color, icon, done) {
  if (reduceMotion) return done && done();
  const p = document.createElement('div');
  p.className = 'packet';
  p.style.setProperty('--c', color);
  p.textContent = icon;
  floor.appendChild(p);
  const c = ctrlPoint(from, to), frames = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, u = 1 - t;
    frames.push({ left: u * u * from.x + 2 * u * t * c.x + t * t * to.x + 'px',
                  top:  u * u * from.y + 2 * u * t * c.y + t * t * to.y + 'px' });
  }
  p.animate(frames, { duration: 900, easing: 'ease-in-out' }).onfinish = () => { p.remove(); done && done(); };
}
function floatChip(d, text) {
  if (reduceMotion) return;
  const f = document.createElement('div');
  f.className = 'float';
  f.style.setProperty('--c', d.info.color);
  f.style.left = d.pos.x + 'px';
  f.style.top = d.pos.y - 50 + 'px';
  f.textContent = text;
  floor.appendChild(f);
  setTimeout(() => f.remove(), 1900);
}

/* ---------- feed & stats ---------- */
function feed(d, text, t) {
  const li = document.createElement('li');
  li.style.setProperty('--c', d.info.color);
  li.innerHTML = '<span class="d"></span><div><span class="who"></span> <span class="what"></span></div><time></time>';
  li.querySelector('.who').textContent = d.info.name;
  li.querySelector('.what').textContent = text;
  li.querySelector('time').textContent = new Date(t || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const list = $('feed');
  list.prepend(li);
  while (list.children.length > 200) list.lastChild.remove();
}
function updateStats() {
  $('sActive').textContent = Object.values(desks).filter((d) => d.type !== 'lead' && d.state === 'working').length;
  $('sTools').textContent = tools;
  $('sFiles').textContent = files.size;
}
setInterval(() => {
  if (!startT) return;
  const s = Math.floor((Date.now() - startT) / 1000);
  $('sTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}, 1000);

/* ---------- voice (browser speech, no API key) ---------- */
// Speaks only the moments that matter (assignments, agents finishing, reviews, the lead's final reply), not every tool call.
// Each agent gets its own voice/pitch. Browsers only allow speech after a click, so the toggle doubles as that click.
const canSpeak = 'speechSynthesis' in window;
const VOICE_ORDER = Object.keys(ROSTER);
const PITCH = { lead: 1, 'research-planner': 1.2, 'backend-dotnet-dev': 0.8, 'frontend-react-dev': 1.3,
  'qa-automation': 1.1, 'docs-writer': 1.15, 'devops-engineer': 0.9 };
let voiceOn = false, queued = 0, audioCtx = null;
try { voiceOn = localStorage.getItem('teamviz.voice') === 'on'; } catch {}
function setVoice(on) {
  voiceOn = on && canSpeak;
  const b = $('voiceBtn');
  b.textContent = !canSpeak ? '🔇 No voice in this browser' : voiceOn ? '🔊 Voice on' : '🔇 Voice off';
  b.setAttribute('aria-pressed', String(voiceOn));
  b.disabled = !canSpeak;
  try { localStorage.setItem('teamviz.voice', voiceOn ? 'on' : 'off'); } catch {}
  if (!voiceOn && canSpeak) { speechSynthesis.cancel(); queued = 0; }
}
function speakable(text) {
  return String(text || '')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')   // emoji
    .replace(/`/g, '').replace(/[\w.-]+[\\/][\w.\\/-]+/g, (p) => p.split(/[\\/]/).pop())   // paths -> file name
    .replace(/\s+/g, ' ').trim().slice(0, 220);
}
function speak(type, text) {
  if (!voiceOn || !text) return;
  if (queued >= 3) return;   // don't fall minutes behind when several agents report at once
  const u = new SpeechSynthesisUtterance(speakable(text));
  const voices = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
  if (voices.length) u.voice = voices[Math.max(0, VOICE_ORDER.indexOf(type)) % voices.length];
  u.pitch = PITCH[type] ?? 1;
  u.rate = 1.05;
  u.onend = u.onerror = () => { queued = Math.max(0, queued - 1); };
  queued++;
  speechSynthesis.speak(u);
}
function chime(freq = 880) {
  if (!voiceOn) return;
  try {
    audioCtx = audioCtx || new AudioContext();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.4);
  } catch {}
}
$('voiceBtn').onclick = () => {
  setVoice(!voiceOn);
  if (voiceOn) speak('lead', 'Voice on. I will tell you when agents start and finish.');
};
setVoice(voiceOn);
if (canSpeak) speechSynthesis.getVoices();   // starts loading voices (Chrome loads them lazily)

/* ---------- event handling ---------- */
function actorOf(e) {
  if (e.agentType) { if (e.agentId) idMap[e.agentId] = e.agentType; return e.agentType; }
  if (e.agentId) return idMap[e.agentId] || 'general-purpose';
  return 'lead';
}
function handle(e) {
  const animate = !e.replay;
  if (e.event === 'Reset') return resetAll();
  if (!startT && e.t) startT = e.t;
  if (e.app) $('app').textContent = e.app;
  $('empty').style.display = 'none';

  switch (e.event) {
    case 'UserPromptSubmit': {
      const lead = desks.lead;
      lead.state = 'working';
      setBubble(lead, e.prompt, '📣');
      feed({ info: { name: 'You', color: '#e8ebf7' } }, e.prompt, e.t);
      refreshLead();
      break;
    }
    case 'PreToolUse': {
      const actor = actorOf(e);
      if (actor === 'lead' && e.target) dispatch(e, animate);
      else activity(actor, e, animate);
      break;
    }
    case 'SubagentStart': {
      const type = actorOf(e);
      const d = ensureDesk(type);
      if (e.agentId) d.ids.add(e.agentId);
      if (d.state !== 'working') setState(d, 'working', 'working');
      break;
    }
    case 'SubagentStop': {
      const type = e.agentType || idMap[e.agentId] || lastDispatched;
      if (type) finish(type, e, animate);
      break;
    }
    case 'Phase': {
      showPhase(e.i, e.text);
      feed({ info: { name: `Phase ${e.i + 1} · ${FEATURE_PHASES[e.i]}`, color: '#7c5cf5' } }, e.text, e.t);
      if (animate) speak('lead', `Phase ${e.i + 1}, ${FEATURE_PHASES[e.i]}. ${e.text}`);
      break;
    }
    case 'Ask': {
      const lead = desks.lead;
      lead.state = 'working';
      setBubble(lead, e.text, '❓');
      feed(lead, 'asks you: ' + e.text, e.t);
      refreshLead();
      if (animate) speak('lead', e.text);
      break;
    }
    case 'TaskCompleted': {
      const d = ensureDesk(actorOf(e));
      feed(d, '✅ Completed task' + (e.task ? ': ' + e.task : ''), e.t);
      break;
    }
    case 'Stop': {
      const lead = desks.lead;
      lead.state = 'idle';
      setBubble(lead, e.message || 'Done for now', '💬');
      feed(lead, 'Finished responding', e.t);
      refreshLead();
      if (animate) { chime(660); speak('lead', e.message || 'Done for now'); }
      break;
    }
  }
}
function dispatch(e, animate) {
  const lead = desks.lead, d = ensureDesk(e.target);
  lastDispatched = e.target;
  setBubble(lead, `Assigning → ${d.info.name}`, '📨');
  feed(lead, `→ ${d.info.name}: ${e.text}`, e.t);
  if (animate) speak('lead', `${d.info.name}, ${e.text}`);
  const gen = ++d.gen;
  const arrive = () => {
    if (gen !== d.gen) return;   // the agent already moved on (packet animation finished late, e.g. background tab)
    setState(d, 'working', 'working');
    setBubble(d, e.text, '📨');
  };
  if (animate) packet(lead.pos, d.pos, d.info.color, '📨', arrive); else arrive();
}
function activity(actor, e, animate) {
  const d = ensureDesk(actor);
  d.gen++;
  if (actor !== 'lead' && d.state !== 'working') setState(d, 'working', 'working');
  if (actor === 'lead') { d.state = 'working'; refreshLead(); }
  tools++; d.actions++;
  if (e.file) files.add(e.file);
  const browser = /^mcp__playwright__/.test(e.tool || '');
  setBubble(d, e.text, TOOL_ICON[e.tool] || (browser ? '🌐' : '⚙️'));
  if (e.tool === 'Skill' && REVIEW_SKILLS.test(e.skill)) {
    updateStages('Review');
    if (animate) speak(actor, `Starting ${e.skill.replace(/-/g, ' ')}`);
  }
  if (animate && (e.tool === 'Edit' || e.tool === 'Write' || e.tool === 'MultiEdit') && e.file) floatChip(d, '+ ' + e.file);
  if (animate && /^(Bash|PowerShell)$/.test(e.tool)) floatChip(d, '⌨️ run');
  if (animate && browser && /screenshot/.test(e.tool)) floatChip(d, '📸 screenshot');
  feed(d, e.text, e.t);
  updateStats();
}
function finish(type, e, animate) {
  const d = ensureDesk(type), lead = desks.lead;
  d.gen++;
  if (e.agentId) d.ids.delete(e.agentId);
  if (d.ids.size > 0) { setState(d, 'working', 'working'); return; }
  setState(d, 'done', 'done ✓');
  setBubble(d, e.message || 'Finished — reporting back', '✅');
  feed(d, '✅ Finished' + (e.message ? ': ' + e.message : ''), e.t);
  if (animate) {
    packet(d.pos, lead.pos, d.info.color, '✅');
    chime();
    speak(type, `${d.info.name} finished. ${e.message || ''}`);
  }
  d.timer = setTimeout(() => { setBubble(d, ''); setState(d, 'idle', `done · ${d.actions} actions`); }, 9000);
}
function resetAll() {
  for (const d of Object.values(desks)) { clearTimeout(d.timer); d.el.remove(); d.wire && d.wire.remove(); }
  desks = {}; idMap = {}; files = new Set(); tools = 0; startT = 0; lastDispatched = null; stageSeen = new Set();
  $('feed').innerHTML = ''; $('app').textContent = '—'; $('sTime').textContent = '0:00';
  $('empty').style.display = '';
  $('narrator').hidden = true;

  resetAll();
  let at = 300;
  for (const [delay, evt] of script) {
    at += delay;
    demoTimers.push(setTimeout(() => handle({ ...evt, t: Date.now() }), at));
  }
  if (EMBED) demoTimers.push(setTimeout(() => playDemo(script === DEMO ? FEATURE_DEMO : DEMO), at + 6000));
}

      { step: 'Build', who: ['backend-dotnet-dev', 'frontend-react-dev'], what: 'In parallel; the OpenAPI snapshot is the contract between them.' },
      { step: 'Test', who: ['qa-automation'], what: 'Unit, integration and end-to-end tests in a visible browser.' },
      { step: 'Review', who: ['lead', 'code-reviewer'], what: '/code-review and /security-review, plus a second opinion on big features.', loop: '↺ fixes go back to Build' },
      { step: 'Docs', who: ['docs-writer'], what: 'Documents only what is built and verified.' },
      { step: 'Deploy', who: ['devops-engineer'], what: 'Docker, CI and hosting; never pushes without asking.' },
    ] },
    { title: 'Big feature in an existing app', note: '/feature-dev runs these steps first, then joins the flow above at Build.', steps: [
      { step: 'Explore', who: [['code-explorer', '×2–3']], what: 'Scouts trace how the existing code works.' },
      { step: 'Clarify', who: ['lead', 'you'], what: 'The Lead asks you about anything the code leaves open.' },
      { step: 'Plan', who: ['research-planner'], what: 'Plans from the Scouts’ findings; researches only what is new.' },
      { step: 'Blueprint', who: [['code-architect', '×2–3']], what: 'Architects turn the plan into 2–3 build options.' },
      { step: 'Choose', who: ['you'], what: 'You pick a blueprint, then the team builds it.' },
      { step: 'Build →', who: ['backend-dotnet-dev', 'frontend-react-dev'], what: 'Then Test → Review → Docs → Deploy as above.' },
    ] },
  ],
}];

function renderTeams() {
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  $('viewTeam').innerHTML = TEAMS.map((team) => {
    const ids = team.groups.flatMap((g) => g.members);
    const skillCount = new Set(ids.flatMap((id) => PROFILES[id].skills)).size;
    const card = (id) => {
      const info = infoFor(id), p = PROFILES[id];
      const skills = p.skills.length
        ? `<ul class="skills">${p.skills.map((s) => `<li class="skill"><div class="row"><b>${esc(s)}</b><small>${esc(SKILLS[s].src)}</small></div><p>${esc(SKILLS[s].what)}</p></li>`).join('')}</ul>`
        : `<p class="noskill">${esc(p.noSkills)}</p>`;
      return `<article class="card" id="card-${id}" style="--c:${info.color}">
        <div class="card-top">
          <div class="portrait">${avatarSVG(id)}</div>
          <div><h3>${esc(info.name)}</h3><div class="id">${esc(id)}</div>
            <div class="tags"><span class="tag strong">${esc(info.role)}</span><span class="tag">${esc(p.model)}</span>${info.stage ? `<span class="tag">Stage: ${info.stage}</span>` : ''}</div></div>
        </div>
        <p class="about">${esc(p.about)}</p>
        <div><h4>Responsibilities</h4><ul class="duties">${p.duties.map((d) => `<li>${esc(d)}</li>`).join('')}</ul></div>
        <div><h4>Skills &amp; tools (${p.skills.length})</h4>${skills}</div>
        <div class="tools">Tools: <code>${esc(p.tools)}</code></div>
      </article>`;
    };
    const arrow = '<span class="flow-arrow" aria-hidden="true"><svg viewBox="0 0 30 12"><line x1="1" y1="6" x2="26" y2="6"/><path d="M22 1.5 28 6l-6 4.5"/></svg></span>';
    const member = (w) => {
      const [id, count] = Array.isArray(w) ? w : [w, ''];
      if (id === 'you') return `<div class="agent-link you" style="--ac:#94a3b8"><span class="mini" aria-hidden="true">🙋</span><span class="nm">You</span></div>`;
      const info = infoFor(id);
      return `<button class="agent-link" type="button" data-profile="${esc(id)}" style="--ac:${info.color}" title="Open ${esc(info.name)}’s profile">
        <span class="mini">${avatarSVG(id)}${count ? `<span class="x">${esc(count)}</span>` : ''}</span><span class="nm">${esc(info.name)}</span></button>`;
    };
    const lane = (f) => `<section class="lane"><div class="lane-head"><h3>${esc(f.title)}</h3><span>${esc(f.note)}</span></div>
      <ol class="flow" style="--n:${f.steps.length}">${f.steps.map((s, i) => {
        const lead = [s.who[0]].flat()[0];
        return `<li>${i ? arrow : ''}<div class="node" style="--c:${lead === 'you' ? '#94a3b8' : infoFor(lead).color}">
          <div class="step"><b>${i + 1}</b> · ${esc(s.step)}</div>
          <div class="who">${s.who.map(member).join('')}</div>
          <p class="what">${esc(s.what)}</p>${s.loop ? `<span class="loop">${esc(s.loop)}</span>` : ''}
        </div></li>`;
      }).join('')}</ol></section>`;
    return `<header class="team-head">
        <div class="team-emblem" aria-hidden="true">${team.emblem}</div>
        <div class="t"><div class="kicker">${esc(team.kicker)}</div><h1>${esc(team.name)}</h1><p>${esc(team.blurb)}</p></div>
        <div class="team-stats">
          <div class="stat"><b>${ids.length}</b><span>agents</span></div>
          <div class="stat"><b>${skillCount}</b><span>skills &amp; tools</span></div>
          <div class="stat"><b>${STAGES.length}</b><span>stages</span></div>
        </div>
      </header>
      ${team.flows ? `<div class="group-title"><h2>How the team works</h2><span>click an agent to open its profile</span></div>
        <div class="flows">${team.flows.map(lane).join('')}</div>` : ''}
      ${team.groups.map((g) => `<div class="group-title"><h2>${esc(g.title)}</h2><span>${esc(g.note)}</span></div>
        <div class="cards">${g.members.map(card).join('')}</div>`).join('')}`;
  }).join('');
}

/* ---------- tabs ---------- */
function showView(view, focus) {
  const team = view === 'team';
  $('viewFloor').hidden = team;
  $('viewTeam').hidden = !team;
  for (const [tab, on] of [[$('tabFloor'), !team], [$('tabTeam'), team]]) {
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
  }
  if (focus) (team ? $('tabTeam') : $('tabFloor')).focus();
  if (!team) layout();   // the floor measured 0×0 while hidden
  history.replaceState(null, '', location.pathname + location.search + (team ? '#team' : ''));
}
function openProfile(type) {
  const card = document.getElementById('card-' + type);
  if (!card) return;
  showView('team');
  card.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
  card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
}
$('viewTeam').onclick = (ev) => {
  const link = ev.target.closest('[data-profile]');
  if (link) openProfile(link.dataset.profile);
};
$('tabFloor').onclick = () => showView('floor');
$('tabTeam').onclick = () => showView('team');
document.querySelector('.tabs').onkeydown = (ev) => {
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') showView($('viewTeam').hidden ? 'team' : 'floor', true);
};

renderTeams();
initRoster();
connect();
const startOnTeam = location.hash === '#team';
if (params.has('demo') || EMBED) playDemo(params.get('demo') === 'feature' ? FEATURE_DEMO : DEMO);
if (startOnTeam) showView('team');
</script>
